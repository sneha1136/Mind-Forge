name: CI - Backend smoke tests

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/nexus
        run: npx prisma generate

      - name: Push Prisma schema
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/nexus
        run: npx prisma db push --accept-data-loss

      - name: Start server
        working-directory: ./backend
        env:
          PORT: 5000
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/nexus
          JWT_SECRET: test_jwt
          OPENAI_API_KEY: test
          CERTIFICATE_SECRET: test_cert
        run: |
          npm start &
          sleep 5

      - name: Smoke test root
        run: |
          curl -f http://127.0.0.1:5000/ | jq .
